[book]
title = "Tofu User Guide"
authors = ["Tofu Contributors"]
language = "en"
multilingual = false
src = "src"

[build]
build-dir = "book"
create-missing = true

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/c2akula/tofu"
git-repository-icon = "fa-github"
site-url = "/tofu/"

[output.html.search]
enable = true
